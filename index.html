<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>WhatsCircle — Private Real-Time Chat</title>
    <meta name="description" content="A private, real-time WhatsApp-style group chat web app for friends with no sign-up required. Features rooms, direct messages, reactions, image sharing, and PWA support." />
    
    <meta name="theme-color" content="#075e54" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WhatsCircle" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="WhatsCircle — Private Real-Time Chat" />
    <meta property="og:description" content="A private, real-time WhatsApp-style group chat web app for friends with no sign-up required." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      // Gracefully ignore Vite HMR WebSocket connection notices in iframe environment
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.includes('WebSocket closed without opened') || event.message.includes('failed to connect to websocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || String(reason)) : '';
        if (msg && (msg.includes('WebSocket closed without opened') || msg.includes('failed to connect to websocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#111b21] text-slate-100 antialiased selection:bg-[#00a884] selection:text-white">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
